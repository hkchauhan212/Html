<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Audio tag</title>
	<style type="text/css">
		*{
			box-sizing: border-box;
		}
	</style>
</head>
<body>
	<!-- The HTML <audio> element is used to play an audio file on a web page. -->
	<section class="main">
		<div class="song1">
			<audio controls muted autoplay>
				<source src="Audio/song02.mp3" type="audio/mpeg">
				<source src="Audio/song01.mp3" type="audio/mpeg">
			</audio> 
		</div>
		<div class="audio">
			<audio controls muted autoplay>
				<source src="Audio/song03.mp3" type="audio/mp3">
				<source src="Audio/song05.mp3" type="audio/mp3">
			</audio>
		</div>
	</section>
</body>
</html>


<!-- This element using audio. using controls many difrence. -->
	<!-- you Play auto play in audio then <audio controls muted autoplay> -->
