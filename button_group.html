<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Bootstrap in Button Group</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>

	<!-- Basic example in group button -->
	<div class="container">
		<div>
			<p class="fs-2">Basic example in group button</p>
		</div>
		<div class="btn-group">
		 	<button type="button" class="btn btn-primary">Left</button>
		  	<button type="button" class="btn btn-primary">Middle</button>
		  	<button type="button" class="btn btn-primary">Right</button>
		</div>
	</div>
	<br><hr><br>

	<!-- Mixed styles -->
	<div class="container">
		<div>
			<p class="fs-2">Mixed styles</p>
		</div>
		<div class="btn-group">
  			<button type="button" class="btn btn-danger">Left</button>
  			<button type="button" class="btn btn-warning">Middle</button>
  			<button type="button" class="btn btn-success">Right</button>
		</div>
	</div>
	<br><hr><br>


	<!-- Outlined styles -->
	<div class="container">
		<div>
			<p class="fs-2">Outlined styles</p>
		</div>
		<div class="btn-group" role="group" aria-label="Basic outlined example">
  			<button type="button" class="btn btn-outline-danger">Left</button>
  			<button type="button" class="btn btn-outline-warning">Middle</button>
  			<button type="button" class="btn btn-outline-success">Right</button>
		</div>
	</div>
	<br><hr><br>


	<!-- Checkbox and radio button groups -->
	<div class="container">
		<div>
			<p class="fs-2">Checkbox and radio button groups</p>
		</div>
		<div class="btn-group">
	  		<input type="checkbox" class="btn-check" id="btncheck1" autocomplete="off">
	  		<label class="btn btn-outline-primary" for="btncheck1">Checkbox 1</label>

	  		<input type="checkbox" class="btn-check" id="btncheck2" autocomplete="off">
	  		<label class="btn btn-outline-primary" for="btncheck2">Checkbox 2</label>

	  		<input type="checkbox" class="btn-check" id="btncheck3" autocomplete="off">
	  		<label class="btn btn-outline-primary" for="btncheck3">Checkbox 3</label>
		</div>
	</div>
	<br><hr><br>

	<!-- Button toolbar -->
	<div class="container">
		<div>
			<p>Button toolbar</p>
		</div>
		<div class="btn-toolbar" role="toolbar" aria-label="Toolbar with button groups">
			 <div class="btn-group me-2" role="group" aria-label="First group">
				<button type="button" class="btn btn-primary">1</button>
			    <button type="button" class="btn btn-primary">2</button>
			    <button type="button" class="btn btn-primary">3</button>
			    <button type="button" class="btn btn-primary">4</button>
			</div>
			<div class="btn-group me-2" role="group" aria-label="Second group">
			    <button type="button" class="btn btn-secondary">5</button>
			    <button type="button" class="btn btn-secondary">6</button>
			    <button type="button" class="btn btn-secondary">7</button>
			</div>
			<div class="btn-group" role="group" aria-label="Third group">
			    <button type="button" class="btn btn-info">8</button>
			</div>
		</div>
	</div>


	<!-- Sizing -->
	<div class="container">
		<div>
			<p>Sizing</p>
		</div>
		<div class="btn-group btn-group-lg">
			<button type="button" class="btn btn-primary">Button</button>
			<button type="button" class="btn btn-secondary">Button</button>
			<button type="button" class="btn btn-info">Button</button>
		</div>
		<div class="btn-group">
			<button type="button" class="btn btn-primary">Button</button>
			<button type="button" class="btn btn-secondary">Button</button>
			<button type="button" class="btn btn-info">Button</button>
		</div>
		<div class="btn-group btn-group-sm">
			<button type="button" class="btn btn-primary">Button</button>
			<button type="button" class="btn btn-secondary">Button</button>
			<button type="button" class="btn btn-info">Button</button>
		</div>
	</div>
	<br><hr><br>


	<!-- Nesting -->
	<div class="container">
		<div>
			<p>Nesting</p>
		</div>
		<div class="btn-group">
  				<button type="button" class="btn btn-primary">1</button>
  				<button type="button" class="btn btn-primary">2</button>

  			<div class="btn-group" role="group">
    			<button id="btnGroupDrop1" type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false"> Dropdown </button>
    			<ul class="dropdown-menu" aria-labelledby="btnGroupDrop1">
      				<li><a class="dropdown-item" href="#">Dropdown link</a></li>
      				<li><a class="dropdown-item" href="#">Dropdown link</a></li>
    			</ul>
  			</div>
		</div>
	</div>


<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
</body>
</html>
