<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<style type="text/css">
		*{
			margin: 0px;
			padding: 0px;
			box-sizing: border-box;
		}
		h2{
			margin-bottom: 10px;
		}
		p{
			margin-bottom: 25px;
		}

		.left{
			background-color: aqua;
			width: 20%;
			padding: 25px;
			float: left;
			height: 80px;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.main{
			background-color: red;
			width: 60%;
			padding: 25px;
			float: left;
			height: 80px;
		}
		.main ul{
			list-style-type: none;
			display: flex;
			align-items: center;
			justify-content: space-around;
		}
		.main ul li{
			width: 70px;
			height: auto;
			background-color: whitesmoke;
			padding: 10px;
			border-radius: 15px;
		}
		.main ul li a{
			text-decoration: none;
		}
		.right{
			background-color: aqua;
			width: 20%;
			float: left;
			padding: 25px;	
			height: 80px;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.right button{
			border-radius: 20px;
		}
		.right button a{
			text-decoration: none;
			display: block;
			padding: 7px;
		}
		@media screen and (max-width: 800px) {
	  		.left{
	  			width: 100%;
	  			background-color: whitesmoke;
	  		}
	  		.main{
	  			width: 100%;
	  		}
	  		.right{
	  			display: inline-block;
	  			display: flex;
	  			align-items: center;
	  			justify-content: center;
	  			width: 100%;
	  			background-color: whitesmoke;
	  		}
		}	
		@media screen and (max-width: 391px){
			.main{
				display: flex;
				align-items: center;
				justify-content: center;
				flex-direction: row;
				background-color: gray;
				width: 100%;
				height: auto;
			}
			.main ul{
				display: block;
				width: 100%;
				height: auto;
				display: flex;
				align-items: center;
				justify-content: center;
				flex-direction: column;
			}
			.main ul li {
				margin: 15px;
				text-align: center;
				display: block;
			}
		}
	</style>
</head>
<body>
	<!-- <img src="img/img01.jpg" alt="natural" style=""> -->
	<!-- <h1 style="font-size:10vw;">Responsive Text</h1>
	<p style="font-size:5vw;">Resize the hrowser window to see how the text size scales.</p>
	<p style="font-size:5vw;">Use the "vw" unit when sizing the text. 10vw will set the size to 10% of the viewport width.</p> -->
	<!-- this is mini responsive web site. -->
	<h2>THIS is Heading.</h2>
	<p>Resize the hrowser window.</p>
	<p>Lorem ipsum dolor sit amet, consectetur adipisicing elit, sed do eiusmod
	tempor incididunt ut labore et dolore magna aliqua.</p>
	<div class="left">
		<h2>Web Site</h2>
	</div>
	<div class="main">
		<ul>
			<li><a href="#">Home</a></li>
			<li><a href="#">About</a></li>
			<li><a href="#">Contect</a></li>
			<li><a href="#">Help</a></li>
		</ul>
	</div>
	<div class="right">
		<button><a href="https://www.google.com/" target="_blank">Google seach</a></button>
	</div>
</body>
</html>
