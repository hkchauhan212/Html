<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Image map</title>
</head>
<body>
	<!-- Image Map Generated by http://www.image-map.net/ -->
	<!-- You must define the shape of the clickable area, and you can choose one of these values:
	rect - defines a rectangular region
	circle - defines a circular region
	poly - defines a polygonal region
	default - defines the entire region -->
	<img src="google.jpg" usemap="#image-map">

	<map name="image-map">
    <area target="_blank" alt="google " title="google " href="https://www.google.com/" coords="133,130,96,94" shape="rect">
	</map>
	<hr>
	<h2>This is picture tag</h2>
	<hr>
	<picture>
		<source srcset="img/img01.jpg" style="width:250px; height: auto;">
		<source srcset="img/img02.jpg" style="width:250px; height: auto;">
		<source srcset="img/img03.jpg" style="width:250px; height: auto;">
		<img src="img/img04.jpg" style="width:250px; height: auto;">
	</picture>
	<hr>
	<picture>
  		<source srcset="img/img01.jpg" style="width:250px; height: auto;">
  		<source srcset="img/img02.jpg" style="width:250px; height: auto;">
  		<img src="img/img03.jpg" style="width:250px; height: auto;">
	</picture>
</body>
</html>
