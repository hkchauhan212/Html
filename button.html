<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Bootstrap in Buttonns</title>
	<!-- Use Bootstrap’s custom button styles for actions in forms, dialogs, and more with support for multiple sizes, states, and more. -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>

	<!-- Simple Button -->
	<div class="container">
		<div>
			<p>Button</p>
		</div>
		<button type="button" class="btn btn-primary">Primary</button>
		<button type="button" class="btn btn-secondary">Secondary</button>
		<button type="button" class="btn btn-success">Success</button>
		<button type="button" class="btn btn-danger">Danger</button>
		<button type="button" class="btn btn-warning">Warning</button>
		<button type="button" class="btn btn-info">Info</button>
		<button type="button" class="btn btn-light">Light</button>
		<button type="button" class="btn btn-dark">Dark</button>
		<button type="button" class="btn btn-link">Link</button>		
	</div>
	<br><hr><br>

	<!-- Button tags -->
	<div class="container">
		<div>
			<p>Button tags</p>
		</div>
		<a class="btn btn-primary" href="#" role="button">Link</a>
		<button class="btn btn-primary" type="submit">Button</button>
		<input class="btn btn-primary" type="button" value="Input">
		<input class="btn btn-primary" type="submit" value="Submit">
		<input class="btn btn-primary" type="reset" value="Reset">		
	</div>
	<br><hr><br>

	<!-- Outline buttons -->
	<div class="container">
		<div>
			<p>Outline buttons</p>
		</div>
		<button type="button" class="btn btn-outline-primary">Button</button>		
		<button type="button" class="btn btn-outline-secondary">Button</button>		
		<button type="button" class="btn btn-outline-info">Button</button>		
		<button type="button" class="btn btn-outline-warning">Button</button>		
		<button type="button" class="btn btn-outline-danger">Button</button>		
		<button type="button" class="btn btn-outline-success">Button</button>		
		<button type="button" class="btn btn-outline-light">Button</button>		
		<button type="button" class="btn btn-outline-dark">Button</button>		
	</div>
	<br><hr><br>

	<!-- Size -->
	<div class="container">
		<div>
			<p>Button Size</p>
		</div>
		<button type="button" class="btn btn-primary btn-lg">Button</button>		
		<button type="button" class="btn btn-secondary">Button</button>		
		<button type="button" class="btn btn-info btn-sm">Button</button>			
	</div>
	<br><hr><br>

	<!-- Disabled state -->
	<div class="container">
		<div>
			<p>Button Disabled</p>
		</div>
		<button type="button" class="btn btn-primary">Button</button>		
		<button type="button" class="btn btn-secondary disabled">button disabled</button>			
	</div>
	<br><hr><br>

	<!-- Block buttons -->
	<div class="container">
		<div>
			<p>Button Block buttons</p>
		</div>
		<!-- You can default set a width "w-25" -->
		<div class="d-grid gap-3 mb-3" >
		 	<button class="btn btn-primary" type="button">Button</button>
			<button class="btn btn-primary" type="button">Button</button>
		</div>
		<hr>
		<p class="mt-3">d-grid gap-2 col-6 mx-auto</p>
		<div class="d-grid gap-2 col-6 mx-auto">
			<button class="btn btn-primary" type="button">Button</button>
		  	<button class="btn btn-primary" type="button">Button</button>
		</div>			
	</div>
	<br><hr><br>





<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>

</body>
</html>
