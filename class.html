<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Class Attribute</title>
	<style type="text/css">
		.para{
			background-color: yellowgreen;
		}
		.this_para{
			color: whitesmoke;
		}
		.p1{
			font-size: 1.5rem;
			border-radius: 25px;
			padding: 20px;
			margin: 150px;
		}
	</style>
</head>
<body>
	<!-- The HTML class attribute is used to specify a class for an HTML element.
	Multiple HTML elements can share the same class. 
	The class attribute can be used on any HTML element.
	The class name is case sensitive! 
	Different HTML elements can point to the same class name.
	In the following example, both <h2> and <p> point to the "city" class and will share the same style:-->

	<!-- sing The class Attribute "." 
	The class attribute is often used to point to a class name in a style sheet. It can also be used by a JavaScript to access and manipulate elements with the specific class name.
	In the following example we have three <div> elements with a class attribute with the value of "city". All of the three <div> elements will be styled equally according to the .city style definition in the head section: -->

	<p class="para this_para p1">Lorem ipsum dolor sit amet, consectetur adipisicing elit, sed do eiusmod
	tempor incididunt ut labore et dolore magna aliqua.</p>
</body>
</html>
