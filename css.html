<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Html in Css</title>
	<link rel="stylesheet" type="text/css" href="style.css">
	<style type="text/css">
		.para02{
			font-size: 20px;
			color: green;
		}
	</style>
</head>
<body>
	<!-- Cascading Style Sheets (CSS) is used to format the layout of a webpage. -->
	<!-- Inline - by using the style attribute inside HTML elements
	Internal - by using a <style> element in the <head> section
	External - by using a <link> element to link to an external CSS file -->
	<!-- inline css -->
	<p style="font-size: 20px; color: red;">This paragraph is style to inline css.</p>
	<!-- internal css -->
	<p class="para02">This paragraph is style to internal css.</p>
	<!-- external css -->
	<p class="para03" id="para03">This paragraph is  style to external css.</p>
	
</body>
</html>
