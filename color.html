<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>color</title>
	<style type="text/css">
		.class{
			margin: 50px 20px;
			box-sizing: border-box;
			height: 300px;
			width: 300px;
			display: inline-block;
			text-align: center;
			padding-top: 125px;
			font-size: 2rem;
			color: rgba(250, 250, 250, 0.8);
		}
		.class01{
			background-color: rgb(255, 0, 0);
			border: 5px solid black;
		}.class02{
			background-color: #00ff00;
			border: 5px dotted black;
		}.class03{
			background-color: hsl(250, 100%, 50%);
			border: 5px dashed black;
		}
	</style>
</head>
<body>
	<!-- HTML colors are specified with predefined color names, or with RGB, HEX, HSL, RGBA, or HSLA values -->
	<!-- Background Color
	Text Color
	Border Color -->
	<!-- RGB -->
	<!-- To display black, set all color parameters to 0, like this: rgb(0, 0, 0).
	To display white, set all color parameters to 255, like this: rgb(255, 255, 255).-->
	<!-- HEX -->
	<!-- To display black, set all color parameters to 00, like this: #000000.
	To display white, set all color parameters to ff, like this: #ffffff. -->
	<!-- HSL -->
	<!-- hsl(hue, saturation, lightness) hsl(0, 100%, 50%)
	HSL stands for hue, saturation, and lightness.
	HSLA color values are an extension of HSL with an Alpha channel (opacity).
	Hue is a degree on the color wheel from 0 to 360. 0 is red, 120 is green, and 240 is blue.
	Saturation is a percentage value. 0% means a shade of gray, and 100% is the full color.
	Lightness is also a percentage value. 0% is black, and 100% is white. -->
	<div>
		<div class="class01 class">this is class01</div>
		<div class="class02 class">this is class02</div>
		<div class="class03 class">this is class03</div>
	</div>
</body>
</html>
